name: Günlük Oran Güncelleme

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update.yml'
      - 'update_rates.py'
      - 'test_update_rates.py'
      - 'kriweb/**'
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 8 * * *'
    - cron: '0 12 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  guncelle-ve-yayinla:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        run: pip install requests pillow

      - name: Ayrıştırıcı testleri
        run: python -m unittest -v test_update_rates.py

      - name: Tek kullanımlık Kriweb toplayıcısını hazırla
        id: collector
        shell: bash
        run: |
          token="$(openssl rand -hex 32)"
          echo "::add-mask::${token}"
          name="collector-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.php"
          mkdir -p runtime
          sed "s/__TOKEN__/${token}/g" kriweb/collector.php.template > "runtime/${name}"
          echo "token=${token}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Toplayıcıyı Kriweb'e geçici yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./runtime/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}runtime/
          dangerous-clean-slate: false

      - name: Veriyi Kriweb IP'si üzerinden topla
        shell: bash
        env:
          COLLECTOR_TOKEN: ${{ steps.collector.outputs.token }}
          COLLECTOR_NAME: ${{ steps.collector.outputs.name }}
        run: |
          http_status="$(curl --silent --show-error \
            --get --data-urlencode "token=${COLLECTOR_TOKEN}" \
            "https://kredioran.com/runtime/${COLLECTOR_NAME}" \
            --output source_snapshot.json --write-out '%{http_code}')"
          if [ "${http_status}" != "200" ]; then
            echo "::error::Kriweb toplayıcısı HTTP ${http_status} döndürdü"
            head -c 2000 source_snapshot.json
            exit 1
          fi
          python -c 'import json; d=json.load(open("source_snapshot.json")); print({s:{k:v["status"] for k,v in c.items()} for s,c in d["pages"].items()})'

      - name: Oranları Hesapkurdu ve Enuygun'dan güncelle
        env:
          RATE_SNAPSHOT_FILE: source_snapshot.json
        run: python update_rates.py

      - name: Geçici dosyaları temizle
        if: always()
        run: rm -rf runtime source_snapshot.json

      - name: Siteyi yeniden üret (115 sayfa + index + sitemap)
        run: python generate_pages.py

      - name: Google Ads banner'larını tazele
        run: python make_banners.py

      - name: Değişiklikleri repoya işle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Otomatik oran güncellemesi + banner tazeleme"

      - name: Kriweb'e FTP ile yükle
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
          dangerous-clean-slate: false
